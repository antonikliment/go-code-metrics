# Reusable: after a merge, set ceilings to what main now measures and publish
# the table to the job summary. With dashboard-issue, the same table also
# goes to the issue labelled `loc-budgets`. Only this job edits the
# ledger, so PRs never conflict on it. The token must be allowed to push to
# the default branch (a ruleset bypass for the app).
# Caller trigger: push to the default branch; use a concurrency group.
name: budget-main

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: latest
      ledger:
        type: string
        default: .loc-budgets.json
      budgets-repo:
        description: separate repo of the same owner holding the ledger as <owner>/<repo>.json on its default branch (empty keeps it in this repo)
        type: string
        default: ''
      dashboard-issue:
        description: also publish the table to the issue labelled loc-budgets
        type: boolean
        default: false
    secrets:
      app-id:
        description: line-warden GitHub App id; with app-key, mints the push token
        required: false
      app-key:
        description: line-warden GitHub App private key
        required: false
      token:
        description: token that can push to the default branch, and edit issues when dashboard-issue is on; default github.token (needs contents write, issues write only with dashboard-issue, no branch protection)
        required: false

jobs:
  raise:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.app-id != '' }}
      TOOL: github.com/antonikliment/go-code-metrics/cmd/go-code-metrics@${{ inputs.version }}
    steps:
      - id: name
        env:
          BUDGETS_REPO: ${{ inputs.budgets-repo }}
        run: echo "repos=${GITHUB_REPOSITORY#*/}${BUDGETS_REPO:+,${BUDGETS_REPO#*/}}" >> "$GITHUB_OUTPUT"
      - id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-key }}
          repositories: ${{ steps.name.outputs.repos }}
      - id: tok
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.token || github.token }}
        run: |
          t=${APP_TOKEN:-$PAT}
          [ -n "$t" ] || { echo "set app-id/app-key or token" >&2; exit 1; }
          echo "::add-mask::$t"
          echo "token=$t" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.tok.outputs.token }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go install "$TOOL"
      # Committing through the contents API, not git push, makes GitHub sign the
      # commit as the token's app, so it passes a signed-commits rule as verified.
      - name: sync
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          LEDGER: ${{ inputs.ledger }}
          BUDGETS_REPO: ${{ inputs.budgets-repo }}
        run: |
          # budgets-repo holds it as <owner>/<repo>.json on its own default branch,
          # so the PUT there takes no branch and no sha when it is new.
          dst="$GITHUB_REPOSITORY/contents/$LEDGER"
          branch="$GITHUB_REF_NAME"
          if [ -n "$BUDGETS_REPO" ]; then
            dst="$BUDGETS_REPO/contents/$GITHUB_REPOSITORY.json"
            branch=
            gh api "repos/$dst" --jq .content 2>/dev/null | base64 -d > old
            cp old "$LEDGER"
            sha=$(gh api "repos/$dst" --jq .sha 2>/dev/null) || sha=
          else
            cp "$LEDGER" old
            sha=$(git rev-parse "HEAD:$LEDGER")
          fi
          go-code-metrics budget sync -ledger "$LEDGER"
          cmp -s old "$LEDGER" && exit 0
          gh api -X PUT "repos/$dst" -f message="LoC budgets: sync to main after ${GITHUB_SHA::7}" \
            -f content="$(base64 -w0 "$LEDGER")" ${sha:+-f sha=$sha} ${branch:+-f branch=$branch} \
            --jq '"committed \(.commit.sha[:7]) verified=\(.commit.verification.verified)"'

      # The summary needs no repository permission and always shows the table
      # for this commit, so it is the dashboard; the issue stays opt-in.
      - name: summary
        run: |
          { echo "Current \`${GITHUB_REF_NAME}\` LoC usage, updated by budget-main at ${GITHUB_SHA::7}."; echo
            go-code-metrics budget report -ledger ${{ inputs.ledger }}; } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: dashboard issue
        if: inputs.dashboard-issue
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          n=$(gh issue list --label loc-budgets --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md
          else gh issue create --title "LoC budgets (${GITHUB_REF_NAME})" --label loc-budgets --body-file body.md; fi
